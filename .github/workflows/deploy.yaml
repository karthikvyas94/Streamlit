name: Build and deploy Streamlit

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/genai-streamlit

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$DOCKERHUB_IMAGE:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" --tag "$DOCKERHUB_IMAGE:latest" .
          docker push "$IMAGE_URI"
          docker push "$DOCKERHUB_IMAGE:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy image to EC2 through SSM
        run: |
          PARAMETERS=$(jq -cn --arg image "$IMAGE_URI" '{
            commands: [
              "docker pull \($image)",
              "docker rm -f genai-streamlit 2>/dev/null || true",
              "docker run -d --restart unless-stopped --name genai-streamlit -p 8501:8501 \($image)"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"
          aws ssm wait command-executed \
            --instance-id "$EC2_INSTANCE_ID" \
            --command-id "$COMMAND_ID"